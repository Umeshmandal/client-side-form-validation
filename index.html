<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="registration-card">

            <!-- FIRST FORM -->
            <div id="contactSection">

                <div class="header">
                    <div class="icon">✓</div>

                    <h1>Registration Form</h1>

                    <p>Enter your details below</p>
                </div>

                <form id="contactForm" novalidate>

                    <div class="form-group">
                        <label for="contactName">
                            Name <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="contactName"
                            placeholder="Enter your name"
                        >

                        <small id="contactNameError" class="error"></small>
                    </div>


                    <div class="form-group">
                        <label for="contactEmail">
                            Email <span>*</span>
                        </label>

                        <input
                            type="email"
                            id="contactEmail"
                            placeholder="example@gmail.com"
                        >

                        <small id="contactEmailError" class="error"></small>
                    </div>


                    <div class="form-group">
                        <label for="contactPhone">
                            Phone <span>*</span>
                        </label>

                        <input
                            type="tel"
                            id="contactPhone"
                            maxlength="10"
                            placeholder="Enter 10-digit phone number"
                        >

                        <small id="contactPhoneError" class="error"></small>
                    </div>


                    <div class="form-group">
                        <label for="subject">
                            Subject <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="subject"
                            placeholder="Enter subject"
                        >

                        <small id="subjectError" class="error"></small>
                    </div>


                    <div class="form-group">
                        <label for="message">
                            Message <span>*</span>
                        </label>

                        <textarea
                            id="message"
                            rows="4"
                            placeholder="Enter your message"
                        ></textarea>

                        <small id="messageError" class="error"></small>
                    </div>


                    <button type="submit">
    Submit
                </button>

                <button type="reset" class="reset-button">
                    Reset
                    </button>

                </form>

            </div>


            <!-- SIGN UP FORM -->
            <div id="signupSection" class="hidden">

                <div class="header">
                    <div class="icon">✓</div>

                    <h1>Sign Up</h1>

                    <p>Create your account</p>
                </div>

                <form id="signupForm" novalidate>

                    <div class="form-group">
                        <label for="username">
                            Username <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter username"
                        >

                        <small id="usernameError" class="error"></small>
                    </div>


                    <div class="form-group">
                        <label for="signupEmail">
                            Email <span>*</span>
                        </label>

                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="example@gmail.com"
                        >

                        <small id="signupEmailError" class="error"></small>
                    </div>


                    <div class="form-group">
                        <label for="signupPassword">
                            Password <span>*</span>
                        </label>

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                        >

                        <small id="signupPasswordError" class="error"></small>
                    </div>


                    <div class="form-group">
                        <label for="passwordAgain">
                            Password Again <span>*</span>
                        </label>

                        <input
                            type="password"
                            id="passwordAgain"
                            placeholder="Enter password again"
                        >

                        <small id="passwordAgainError" class="error"></small>
                    </div>


                    <button type="submit">
                        Sign Up
                    </button>

                    <button type="reset" class="reset-button">
                        Reset
                    </button>

                    <div id="signupSuccess" class="success"></div>

                </form>

            </div>

        </div>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
